name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Dashboard (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  bridge:
    name: Python bridge and race library script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - run: pip install -r bridge/requirements.txt numpy pyyaml
      - name: Bridge tests
        working-directory: bridge
        run: python -m unittest test_translator.py test_openf1_live.py
      - name: Scripts compile
        run: python -m py_compile scripts/build_race_library.py bridge/bridge.py bridge/openf1_live.py
